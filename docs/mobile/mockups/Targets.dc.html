<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Targets and item picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#e8a04a}a:hover{color:#f3b86b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1b1b1b; color: #e8e4dc; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 15px; overflow: hidden; position: relative">

  <header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #333">
    <a href="Main.dc.html" aria-label="Back to factory" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #e8e4dc; text-decoration: none; border-radius: 10px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600; flex-grow: 1">Targets</h1>
    <button type="button" style="min-height: 44px; padding: 0 14px; border: 1px solid #3a3a3a; border-radius: 10px; background: #262626; color: #e8a04a; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 6px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add
    </button>
  </header>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #262626; border: 1px solid #e8a04a">
      <div style="width: 36px; height: 36px; border-radius: 8px; background: #4f8f5a; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #0f1a10; flex-shrink: 0">EC</div>
      <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
        <span style="font-weight: 500">Electronic circuit</span>
        <span style="font-size: 13px; color: #a8a399">Normal quality</span>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500">600<span style="font-size: 12px; color: #a8a399; font-family: 'IBM Plex Sans', sans-serif">/min</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #262626; border: 1px solid #3a3a3a">
      <div style="width: 36px; height: 36px; border-radius: 8px; background: #5d6f8f; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #0e1218; flex-shrink: 0">AC</div>
      <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
        <span style="font-weight: 500">Advanced circuit</span>
        <span style="font-size: 13px; color: #a8a399">Normal quality</span>
      </div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 17px; font-weight: 500">8<span style="font-size: 12px; color: #a8a399; font-family: 'IBM Plex Sans', sans-serif"> mach.</span></span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>

  <section aria-label="Edit target" style="display: flex; flex-direction: column; gap: 14px; padding: 8px 16px 20px; background: #262626; border-top: 1px solid #3a3a3a; border-radius: 18px 18px 0 0; box-shadow: 0 -12px 32px rgba(0,0,0,0.45)">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #4a4a4a; align-self: center"></div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 16px; font-weight: 600">Edit target</h2>
      <button type="button" aria-label="Remove target" style="min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #e07b6a; font-size: 14px; font-weight: 500">Remove</button>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #a8a399">Item</span>
      <input type="search" value="electronic" aria-label="Search items" style="box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #3a3a3a; background: #1b1b1b; color: #e8e4dc; font-size: 16px; font-family: inherit">
    </label>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <button type="button" aria-label="Electronic circuit" aria-pressed="true" style="height: 60px; border-radius: 10px; border: 2px solid #e8a04a; background: #4f8f5a; color: #0f1a10; font-size: 12px; font-weight: 600; padding: 0">EC</button>
      <button type="button" aria-label="Advanced circuit" aria-pressed="false" style="height: 60px; border-radius: 10px; border: 2px solid transparent; background: #5d6f8f; color: #0e1218; font-size: 12px; font-weight: 600; padding: 0">AC</button>
      <button type="button" aria-label="Processing unit" aria-pressed="false" style="height: 60px; border-radius: 10px; border: 2px solid transparent; background: #7a6aa8; color: #120e1c; font-size: 12px; font-weight: 600; padding: 0">PU</button>
      <button type="button" aria-label="Electric engine unit" aria-pressed="false" style="height: 60px; border-radius: 10px; border: 2px solid transparent; background: #8a97a8; color: #101418; font-size: 12px; font-weight: 600; padding: 0">EE</button>
      <button type="button" aria-label="Electric furnace" aria-pressed="false" style="height: 60px; border-radius: 10px; border: 2px solid transparent; background: #9a8f7a; color: #1a1610; font-size: 12px; font-weight: 600; padding: 0">EF</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #a8a399">Specify by</span>
      <div role="group" aria-label="Specify by" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #1b1b1b">
        <button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 9px; background: #e8a04a; color: #1b1b1b; font-weight: 600; font-size: 15px">Rate</button>
        <button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 9px; background: transparent; color: #e8e4dc; font-weight: 500; font-size: 15px">Machines</button>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #a8a399">Items per minute</span>
        <div style="display: flex; align-items: center; border-radius: 12px; border: 1px solid #3a3a3a; background: #1b1b1b; overflow: hidden">
          <button type="button" aria-label="Decrease" style="width: 44px; height: 48px; border: 0; background: transparent; color: #e8e4dc; font-size: 20px">−</button>
          <input type="text" inputmode="decimal" value="600" aria-label="Rate" style="flex-grow: 1; min-width: 0; height: 48px; border: 0; background: transparent; color: #e8e4dc; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500">
          <button type="button" aria-label="Increase" style="width: 44px; height: 48px; border: 0; background: transparent; color: #e8e4dc; font-size: 20px">+</button>
        </div>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #a8a399">Quality</span>
        <select aria-label="Quality" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #3a3a3a; background: #1b1b1b; color: #e8e4dc; font-size: 15px; font-family: inherit">
          <option>Normal</option><option>Uncommon</option><option>Rare</option><option>Epic</option><option>Legendary</option>
        </select>
      </label>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: #1b1b1b">
      <span style="color: #a8a399; font-size: 14px">Belts needed</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px">0.67 × yellow</span>
    </div>

    <a href="Main.dc.html" style="height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #e8a04a; color: #1b1b1b; font-weight: 600; font-size: 16px; text-decoration: none">Done</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
