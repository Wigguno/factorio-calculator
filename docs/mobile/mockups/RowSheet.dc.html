<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Row editor sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#e8a04a}a:hover{color:#f3b86b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #1b1b1b; color: #e8e4dc; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; font-size: 15px; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #333">
    <a href="Main.dc.html" aria-label="Back to factory" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #e8e4dc; text-decoration: none; border-radius: 10px">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="width: 32px; height: 32px; border-radius: 7px; background: #4f8f5a; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #0f1a10; flex-shrink: 0">EC</div>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Electronic circuit</h1>
      <span style="font-size: 13px; color: #a8a399">600/min · 4 machines · 1.5 MW</span>
    </div>
  </header>

  <main style="flex-grow: 1; overflow-y: auto; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 20px">

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #a8a399">Machine</h2>
      <div role="group" aria-label="Machine" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-pressed="false" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 12px; padding: 0">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">AM1</span>
          <span style="color: #a8a399">0.5×</span>
        </button>
        <button type="button" aria-pressed="false" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 12px; padding: 0">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">AM2</span>
          <span style="color: #a8a399">0.75×</span>
        </button>
        <button type="button" aria-pressed="true" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; border: 2px solid #e8a04a; background: #2e2a22; color: #e8e4dc; font-size: 12px; padding: 0">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">AM3</span>
          <span style="color: #e8a04a">1.25×</span>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #a8a399">Modules · 4 slots</h2>
        <button type="button" style="min-height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #e8a04a; font-size: 14px; font-weight: 500">Fill all</button>
      </div>
      <div role="group" aria-label="Module slots" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <button type="button" aria-label="Slot 1: Productivity module 3" style="height: 64px; border-radius: 12px; border: 1px solid #3a3a3a; background: #6b3f3f; color: #f6e4e4; font-size: 12px; font-weight: 600; padding: 0">PROD 3</button>
        <button type="button" aria-label="Slot 2: Productivity module 3" style="height: 64px; border-radius: 12px; border: 1px solid #3a3a3a; background: #6b3f3f; color: #f6e4e4; font-size: 12px; font-weight: 600; padding: 0">PROD 3</button>
        <button type="button" aria-label="Slot 3: Productivity module 3" style="height: 64px; border-radius: 12px; border: 1px solid #3a3a3a; background: #6b3f3f; color: #f6e4e4; font-size: 12px; font-weight: 600; padding: 0">PROD 3</button>
        <button type="button" aria-label="Slot 4: Productivity module 3" style="height: 64px; border-radius: 12px; border: 1px solid #3a3a3a; background: #6b3f3f; color: #f6e4e4; font-size: 12px; font-weight: 600; padding: 0">PROD 3</button>
      </div>
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
        <button type="button" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 14px">None</button>
        <button type="button" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 14px">Speed 3</button>
        <button type="button" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #e8a04a; background: #2e2a22; color: #e8e4dc; font-size: 14px">Prod 3</button>
        <button type="button" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 14px">Efficiency 3</button>
        <button type="button" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 14px">Quality 3</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #a8a399">Beacons</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; color: #a8a399">Count per machine</span>
          <div style="display: flex; align-items: center; border-radius: 12px; border: 1px solid #3a3a3a; background: #262626; overflow: hidden">
            <button type="button" aria-label="Fewer beacons" style="width: 44px; height: 48px; border: 0; background: transparent; color: #e8e4dc; font-size: 20px">−</button>
            <input type="text" inputmode="numeric" value="2" aria-label="Beacon count" style="flex-grow: 1; min-width: 0; height: 48px; border: 0; background: transparent; color: #e8e4dc; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 500">
            <button type="button" aria-label="More beacons" style="width: 44px; height: 48px; border: 0; background: transparent; color: #e8e4dc; font-size: 20px">+</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 13px; color: #a8a399">Beacon module</span>
          <select aria-label="Beacon module" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 15px; font-family: inherit">
            <option>Speed 3</option><option>Speed 2</option><option>Efficiency 3</option><option>None</option>
          </select>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: #a8a399">Location</h2>
      <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
        <button type="button" aria-pressed="true" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #e8a04a; background: #2e2a22; color: #e8e4dc; font-size: 14px">Nauvis</button>
        <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 14px">Vulcanus</button>
        <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 14px">Fulgora</button>
        <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 14px">Gleba</button>
        <button type="button" aria-pressed="false" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a3a; background: #262626; color: #e8e4dc; font-size: 14px">Aquilo</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 0; border-radius: 12px; border: 1px solid #3a3a3a; background: #262626; overflow: hidden">
      <div style="display: flex; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid #333"><span style="color: #a8a399">Effective speed</span><span style="font-family: 'IBM Plex Mono', monospace">3.75×</span></div>
      <div style="display: flex; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid #333"><span style="color: #a8a399">Productivity</span><span style="font-family: 'IBM Plex Mono', monospace">+40%</span></div>
      <div style="display: flex; justify-content: space-between; padding: 11px 14px; border-bottom: 1px solid #333"><span style="color: #a8a399">Power per machine</span><span style="font-family: 'IBM Plex Mono', monospace">375 kW</span></div>
      <div style="display: flex; justify-content: space-between; padding: 11px 14px"><span style="color: #a8a399">Output belts</span><span style="font-family: 'IBM Plex Mono', monospace">0.67 × yellow</span></div>
    </section>

    <button type="button" style="height: 48px; border-radius: 12px; border: 1px solid #3a3a3a; background: transparent; color: #e07b6a; font-weight: 500; font-size: 15px">Ignore this item (treat as supplied)</button>

  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
